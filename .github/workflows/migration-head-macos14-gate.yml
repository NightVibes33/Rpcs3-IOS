name: Migration Head macOS14 Gate

on:
  workflow_dispatch:
  push:
    branches: [migration-head-macos14-gate]
    paths:
      - "NativeApp/**"
      - "scripts/build-real-ios-app.sh"
      - ".github/workflows/migration-head-macos14-gate.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: migration-head-macos14-gate
  cancel-in-progress: true

jobs:
  build:
    name: Compile exact migration head
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Materialize exact source-built XITRIX core
        uses: actions/download-artifact@v4
        with:
          name: RPCS3-XITRIX-build-evidence
          path: baseline-current
          run-id: 36348158249
          github-token: ${{ github.token }}

      - name: Stage exact verified core
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="baseline-current/BuildSupport/RPCS3Core"
          test -s "$SOURCE/libRPCS3Core.dylib"
          test "$(tr -d '[:space:]' < "$SOURCE/RPCS3_SOURCE_COMMIT.txt")" = "559987e966db0f8ac983502a160b419968e2474d"
          test "$(tr -d '[:space:]' < "$SOURCE/RPCS3_IOS_ABI.txt")" = "30"
          test "$(shasum -a 256 "$SOURCE/libRPCS3Core.dylib" | awk '{print $1}')" = "fee47f0b090bb3c8f1dcf6ba0ee825bd9ca93d00a263a8b90b463cc04a7b6891"
          rm -rf BuildSupport/RPCS3Core
          mkdir -p BuildSupport
          cp -R "$SOURCE" BuildSupport/RPCS3Core

      - name: Compile exact migration head
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-real-ios-app.sh 2>&1 | tee migration-head-build.log

      - name: Validate delayed-load product
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat native-ios-build/app-path.txt)"
          BIN="$APP/RPCS3"
          test -s "$BIN"
          test -s "$APP/Frameworks/libRPCS3Core.dylib"
          otool -L "$BIN" | tee migration-head-loads.txt
          ! grep -q 'libRPCS3Core.dylib' migration-head-loads.txt
          grep -q 'SwiftUI.framework/SwiftUI' migration-head-loads.txt
          grep -q 'UIKit.framework/UIKit' migration-head-loads.txt
          ! grep -Eiq 'Qt(Core|Gui|Widgets)|Flutter|RPCS3UpstreamRuntime' migration-head-loads.txt
          strings "$BIN" > migration-head-strings.txt
          grep -q 'ios-host.log' migration-head-strings.txt
          grep -q 'Share RPCS3 Device Log' migration-head-strings.txt

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat native-ios-build/app-path.txt)"
          rm -rf Payload gate-output
          mkdir -p Payload gate-output
          /usr/bin/ditto "$APP" Payload/RPCS3.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload gate-output/RPCS3-migration-head-unsigned.ipa
          test -s gate-output/RPCS3-migration-head-unsigned.ipa

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-migration-head-macos14-gate
          path: |
            migration-head-build.log
            migration-head-loads.txt
            migration-head-strings.txt
            gate-output/*
            native-ios-build/app-file.txt
            native-ios-build/app-archs.txt
          if-no-files-found: warn
          retention-days: 3
