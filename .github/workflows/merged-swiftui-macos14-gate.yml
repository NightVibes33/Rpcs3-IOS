name: Merged SwiftUI macOS14 Gate

on:
  workflow_dispatch:
  push:
    branches: [merged-swiftui-macos14-gate]
    paths:
      - "NativeApp/**"
      - "scripts/build-real-ios-app.sh"
      - ".github/workflows/merged-swiftui-macos14-gate.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: merged-swiftui-macos14-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Materialize source-built RPCS3Core
        uses: actions/download-artifact@v4
        with:
          name: RPCS3-XITRIX-build-evidence
          path: baseline-current
          run-id: 36348158249
          github-token: ${{ github.token }}
      - name: Stage exact verified core
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="baseline-current/BuildSupport/RPCS3Core"
          test -s "$SOURCE/libRPCS3Core.dylib"
          test "$(tr -d '[:space:]' < "$SOURCE/RPCS3_SOURCE_COMMIT.txt")" = "559987e966db0f8ac983502a160b419968e2474d"
          test "$(tr -d '[:space:]' < "$SOURCE/RPCS3_IOS_ABI.txt")" = "30"
          rm -rf BuildSupport/RPCS3Core
          mkdir -p BuildSupport
          cp -R "$SOURCE" BuildSupport/RPCS3Core
      - name: Compile merged SwiftUI host
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-real-ios-app.sh 2>&1 | tee merged-macos14-build.log
      - name: Validate delayed-load product
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat native-ios-build/app-path.txt)"
          BIN="$APP/RPCS3"
          test -s "$BIN"
          test -s "$APP/Frameworks/libRPCS3Core.dylib"
          otool -L "$BIN" | tee merged-macos14-loads.txt
          ! grep -q 'libRPCS3Core.dylib' merged-macos14-loads.txt
          grep -q 'SwiftUI.framework/SwiftUI' merged-macos14-loads.txt
          ! grep -Eiq 'Qt(Core|Gui|Widgets)|Flutter|RPCS3UpstreamRuntime' merged-macos14-loads.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-swiftui-macos14-evidence
          path: |
            merged-macos14-build.log
            merged-macos14-loads.txt
            native-ios-build/app-file.txt
            native-ios-build/app-archs.txt
          if-no-files-found: warn
          retention-days: 3
