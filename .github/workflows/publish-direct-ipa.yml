name: Publish Direct RPCS3 IPA

on:
  workflow_run:
    workflows: ["Build Real XITRIX Frontend IPA"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Build Real RPCS3 iOS run ID"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-direct-ipa.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$EVENT_RUN_ID"
            RUN_SHA="$EVENT_RUN_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RUN_ID="$INPUT_RUN_ID"
            RUN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)"
            test "$CONCLUSION" = "success"
          else
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-real-xitrix-frontend.yml --branch real-xitrix-frontend --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            RUN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          fi
          test -n "$RUN_ID"
          test -n "$RUN_SHA"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "RUN_SHA=$RUN_SHA" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(printf '%s' "$RUN_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Download successful IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: RPCS3-REAL-XITRIX-FRONTEND-current-core-unsigned
          path: downloaded
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate actual IPA payload
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find downloaded -maxdepth 2 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"

          rm -rf verify
          mkdir verify
          unzip -q "$IPA" -d verify

          APP="$(find verify/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"
          test -s "$APP/RPCS3"
          test -s "$APP/Frameworks/libRPCS3Core.dylib"

          python3 - <<'PY'
          import plistlib, pathlib
          apps=list(pathlib.Path("verify/Payload").glob("*.app"))
          assert len(apps)==1, apps
          app=apps[0]
          with (app/"Info.plist").open("rb") as f:
              info=plistlib.load(f)
          assert info.get("CFBundleExecutable")=="RPCS3", info
          assert info.get("CFBundlePackageType")=="APPL", info
          assert info.get("CFBundleIdentifier")=="com.xitrix.RPCS3", info
          assert info.get("CFBundleDisplayName")=="RPCS3", info
          assert info.get("MinimumOSVersion")=="17.4", info
          assert (app/"RPCS3").is_file()
          assert (app/"Frameworks"/"libRPCS3Core.dylib").is_file()
          print("Validated installable IPA:", app)
          PY

          cp "$IPA" RPCS3.ipa
          sha256sum RPCS3.ipa > RPCS3.ipa.sha256

          cat > XITRIX-required-entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.kernel.extended-virtual-addressing</key>
            <true/>
            <key>com.apple.developer.kernel.increased-debugging-memory-limit</key>
            <true/>
            <key>com.apple.developer.kernel.increased-memory-limit</key>
            <true/>
            <key>get-task-allow</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint XITRIX-required-entitlements.plist

          echo "IPA_SHA256=$(awk '{print $1}' RPCS3.ipa.sha256)" >> "$GITHUB_ENV"

      - name: Try GitHub Release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ios-dev-${SHORT_SHA}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" RPCS3.ipa RPCS3.ipa.sha256 XITRIX-required-entitlements.plist --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" RPCS3.ipa RPCS3.ipa.sha256 XITRIX-required-entitlements.plist --title "RPCS3 iOS — Official XITRIX frontend + current core ${SHORT_SHA}" --notes "Unsigned IPA preserving the byte-for-byte official XITRIX v0.9 frontend and replacing only libRPCS3Core.dylib with the current source-built iOS core. Sign the app and nested dylib with the required entitlements before launch." --prerelease --target "$RUN_SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publish stable direct-download branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf direct-publish
          mkdir direct-publish
          cp RPCS3.ipa RPCS3.ipa.sha256 XITRIX-required-entitlements.plist direct-publish/
          cat > direct-publish/README.md <<EOF
          # RPCS3 iOS direct build

          Source build run: ${RUN_ID}
          Source commit: ${RUN_SHA}
          IPA SHA-256: ${IPA_SHA256}

          `RPCS3.ipa` preserves the byte-for-byte official XITRIX v0.9 frontend and uses the current source-built RPCS3 iOS core.

          Before launch, your signer must sign both `Payload/RPCS3.app/RPCS3` and `Payload/RPCS3.app/Frameworks/libRPCS3Core.dylib`.
          The required executable entitlements are included as `XITRIX-required-entitlements.plist`.
          On iOS 26/27, launch RPCS3 from StikDebug with XITRIX's Universal JIT script before pressing Start.
          EOF

          cd direct-publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b downloads
          git add RPCS3.ipa RPCS3.ipa.sha256 XITRIX-required-entitlements.plist README.md
          git commit -m "Publish validated RPCS3 IPA from ${RUN_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin downloads

      - name: Verify stable raw IPA download
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/downloads/RPCS3.ipa"
          for attempt in 1 2 3 4 5; do
            rm -f raw-RPCS3.ipa
            if curl -fL --retry 2 "$URL" -o raw-RPCS3.ipa; then
              ACTUAL="$(sha256sum raw-RPCS3.ipa | awk '{print $1}')"
              if [[ "$ACTUAL" == "$IPA_SHA256" ]]; then
                echo "Direct IPA verified: $URL"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "Direct raw IPA did not match expected SHA-256." >&2
          exit 1
