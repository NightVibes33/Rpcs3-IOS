name: Publish Direct RPCS3 IPA

on:
  workflow_run:
    workflows: ["SwiftUI Host Smoke"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful SwiftUI Host Smoke run ID"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-direct-ipa.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'xitrix-swiftui-host')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve new SwiftUI source run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$EVENT_RUN_ID"
            RUN_SHA="$EVENT_RUN_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RUN_ID="$INPUT_RUN_ID"
            RUN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)"
            NAME="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .name)"
            test "$CONCLUSION" = "success"
            test "$NAME" = "SwiftUI Host Smoke"
          else
            RUN_ID="$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow swiftui-host-smoke.yml               --branch xitrix-swiftui-host               --status success               --limit 1               --json databaseId               --jq '.[0].databaseId')"
            RUN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          fi

          test -n "$RUN_ID"
          test -n "$RUN_SHA"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "RUN_SHA=$RUN_SHA" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(printf '%s' "$RUN_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Download new SwiftUI IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: RPCS3-XITRIX-currentcore-SwiftUI-unsigned
          path: downloaded
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate new frontend and valid IPA bundle
        shell: bash
        run: |
          set -euo pipefail

          IPA="$(find downloaded -maxdepth 3 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"

          rm -rf verify
          mkdir verify
          unzip -q "$IPA" -d verify

          test -d verify/Payload
          APP="$(find verify/Payload -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"

          EXECUTABLE="$(python3 - "$APP/Info.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],"rb") as f:
              p=plistlib.load(f)
          print(p["CFBundleExecutable"])
          PY
          )"
          BIN="$APP/$EXECUTABLE"

          test -s "$BIN"
          test -s "$APP/Frameworks/libRPCS3Core.dylib"

          python3 - "$APP/Info.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],"rb") as f:
              p=plistlib.load(f)

          required = {
              "CFBundlePackageType": "APPL",
              "CFBundleDisplayName": "RPCS3",
          }
          for key,value in required.items():
              assert p.get(key) == value, (key,p.get(key))

          bid=p.get("CFBundleIdentifier","")
          assert bid.startswith("com."), bid
          assert p.get("CFBundleExecutable"), p
          minimum=p.get("MinimumOSVersion","")
          assert minimum, p
          print("Validated app metadata:", bid, p["CFBundleExecutable"], minimum)
          PY

          strings "$BIN" > app-strings.txt
          grep -q 'Start: loading libRPCS3Core.dylib' app-strings.txt
          grep -q 'RPCS3_IOS_EXPANDED_JIT_ARENA' app-strings.txt
          grep -q 'Big Picture Mode' app-strings.txt
          grep -q 'RPCN' app-strings.txt
          grep -q 'Save State Manager' app-strings.txt
          grep -q 'Game Patches' app-strings.txt

          ! grep -q 'RPCS3 Qt iOS upstream main_window.ui' app-strings.txt
          ! grep -q 'RPCS3UpstreamRuntime.framework' app-strings.txt
          ! find "$APP" -path '*Qt*.framework*' -o -name 'RPCS3UpstreamRuntime.framework' | grep -q .

          if command -v llvm-objdump >/dev/null 2>&1; then
            llvm-objdump -p "$BIN" > app-loads.txt || true
            ! grep -q 'libRPCS3Core.dylib' app-loads.txt
          else
            : > app-loads.txt
          fi

          unzip -l "$IPA" > ipa-contents.txt
          grep -Eq 'Payload/[^/]+\.app/Info\.plist$' ipa-contents.txt
          grep -Eq 'Payload/[^/]+\.app/[^/]+$' ipa-contents.txt
          grep -Eq 'Payload/[^/]+\.app/Frameworks/libRPCS3Core\.dylib$' ipa-contents.txt

          cp "$IPA" RPCS3.ipa
          sha256sum RPCS3.ipa > RPCS3.ipa.sha256
          echo "IPA_SHA256=$(awk '{print $1}' RPCS3.ipa.sha256)" >> "$GITHUB_ENV"

      - name: Publish only the new SwiftUI IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf direct-publish
          mkdir direct-publish
          cp RPCS3.ipa RPCS3.ipa.sha256 direct-publish/

          cat > direct-publish/README.md <<EOF
          # RPCS3 iOS direct build

          Source workflow: SwiftUI Host Smoke
          Source run: $RUN_ID
          Source commit: $RUN_SHA
          IPA SHA-256: $IPA_SHA256

          This is the current native SwiftUI/UIKit frontend backed by the current XITRIX RPCS3 iOS core.
          It is NOT the retired Qt frontend and NOT the byte-for-byte XITRIX v0.9 frontend repack.
          EOF

          cd direct-publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b downloads
          git add RPCS3.ipa RPCS3.ipa.sha256 README.md
          git commit -m "Publish current SwiftUI RPCS3 IPA from $RUN_SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin downloads

      - name: Verify stable raw IPA
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/downloads/RPCS3.ipa"

          for attempt in 1 2 3 4 5; do
            rm -f raw-RPCS3.ipa
            if curl -fL --retry 2 "$URL" -o raw-RPCS3.ipa; then
              ACTUAL="$(sha256sum raw-RPCS3.ipa | awk '{print $1}')"
              if [[ "$ACTUAL" == "$IPA_SHA256" ]]; then
                rm -rf raw-verify
                mkdir raw-verify
                unzip -q raw-RPCS3.ipa -d raw-verify
                APP="$(find raw-verify/Payload -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
                test -n "$APP"
                test -f "$APP/Info.plist"
                echo "Direct new-UI IPA verified: $URL"
                exit 0
              fi
            fi
            sleep 3
          done

          echo "Stable raw IPA did not match or was structurally invalid." >&2
          exit 1
