name: SwiftUI Host Smoke

on:
  workflow_dispatch:
  push:
    branches: [xitrix-swiftui-host]
    paths:
      - "NativeApp/**"
      - "scripts/build-real-ios-app.sh"
      - ".github/workflows/swiftui-host-smoke.yml"

permissions:
  contents: read

concurrency:
  group: rpcs3-swiftui-host-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile delayed-load SwiftUI host
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Materialize verified ABI v30 test core
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/RPCS3-v0.9.ipa"
          curl -fL --retry 4             https://github.com/XITRIX/RPCS3-iOS-Releases/releases/download/v0.9/RPCS3.ipa             -o "$IPA"
          echo "4cc11c8a0bc3be74685c2781741a7a2b559e94dac6b81df609ed43523e5cfec0  $IPA" | shasum -a 256 -c -

          mkdir -p "$RUNNER_TEMP/official" BuildSupport/RPCS3Core
          unzip -q "$IPA" -d "$RUNNER_TEMP/official"
          cp "$RUNNER_TEMP/official/Payload/RPCS3.app/Frameworks/libRPCS3Core.dylib" BuildSupport/RPCS3Core/

          curl -fL --retry 4             https://raw.githubusercontent.com/XITRIX/rpcs3/559987e966db0f8ac983502a160b419968e2474d/rpcs3/ios/RPCS3IOS.h             -o BuildSupport/RPCS3Core/RPCS3IOS.h
          curl -fL --retry 4             https://raw.githubusercontent.com/XITRIX/rpcs3/559987e966db0f8ac983502a160b419968e2474d/rpcs3/ios/RPCS3IOS.exports             -o BuildSupport/RPCS3Core/RPCS3IOS.exports

          nm -gU BuildSupport/RPCS3Core/libRPCS3Core.dylib > "$RUNNER_TEMP/core-symbols.txt"
          for symbol in \
            _rpcs3_ios_abi_version \
            _rpcs3_ios_initialize \
            _rpcs3_ios_run_llvm_self_test \
            _rpcs3_ios_update_config_database \
            _rpcs3_ios_set_display_surface \
            _rpcs3_ios_set_pad_state \
            _rpcs3_ios_install_firmware \
            _rpcs3_ios_install_package \
            _rpcs3_ios_install_iso \
            _rpcs3_ios_install_zip \
            _rpcs3_ios_install_folder \
            _rpcs3_ios_install_rap \
            _rpcs3_ios_enumerate_games \
            _rpcs3_ios_enumerate_savestates \
            _rpcs3_ios_enumerate_trophies \
            _rpcs3_ios_enumerate_settings \
            _rpcs3_ios_set_setting \
            _rpcs3_ios_reset_settings \
            _rpcs3_ios_enumerate_game_settings \
            _rpcs3_ios_set_game_setting \
            _rpcs3_ios_reset_game_settings \
            _rpcs3_ios_remove_game_settings \
            _rpcs3_ios_enumerate_runtime_patches \
            _rpcs3_ios_set_runtime_patch_enabled \
            _rpcs3_ios_boot_big_picture_mode \
            _rpcs3_ios_boot_vsh \
            _rpcs3_ios_boot_game \
            _rpcs3_ios_get_boot_progress \
            _rpcs3_ios_get_performance_metrics \
            _rpcs3_ios_pause_emulation \
            _rpcs3_ios_resume_emulation \
            _rpcs3_ios_stop_emulation \
            _rpcs3_ios_shutdown \
            _rpcs3_ios_last_error; do
            grep -q " $symbol$" "$RUNNER_TEMP/core-symbols.txt"
          done

      - name: Compile SwiftUI host
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-real-ios-app.sh 2>&1 | tee swiftui-host-build.log

      - name: Validate official-style process boundary
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat native-ios-build/app-path.txt)"
          BIN="$APP/RPCS3"
          CORE="$APP/Frameworks/libRPCS3Core.dylib"

          test -s "$BIN"
          test -s "$CORE"

          otool -L "$BIN" | tee swiftui-host-loads.txt
          ! grep -q 'libRPCS3Core.dylib' swiftui-host-loads.txt
          grep -q 'SwiftUI.framework/SwiftUI' swiftui-host-loads.txt
          grep -q 'UIKit.framework/UIKit' swiftui-host-loads.txt
          ! grep -Eiq 'Qt(Core|Gui|Widgets)|Flutter|RPCS3UpstreamRuntime' swiftui-host-loads.txt

          strings "$BIN" > swiftui-host-strings.txt
          grep -q 'RPCS3_IOS_EXPANDED_JIT_ARENA' swiftui-host-strings.txt
          grep -q 'Start: loading libRPCS3Core.dylib' swiftui-host-strings.txt
          grep -q 'Big Picture Mode' swiftui-host-strings.txt

          plutil -lint "$APP/Info.plist"
          plutil -p "$APP/Info.plist" | tee swiftui-host-plist.txt
          grep -q '17.4' swiftui-host-plist.txt

      - name: Package unsigned official-core test IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat native-ios-build/app-path.txt)"
          rm -rf Payload smoke-output
          mkdir -p Payload smoke-output
          /usr/bin/ditto "$APP" Payload/RPCS3.app
          rm -rf Payload/RPCS3.app/_CodeSignature
          rm -f Payload/RPCS3.app/embedded.mobileprovision
          test -s Payload/RPCS3.app/RPCS3
          test -s Payload/RPCS3.app/Frameworks/libRPCS3Core.dylib
          /usr/bin/plutil -lint Payload/RPCS3.app/Info.plist

          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          IPA="smoke-output/RPCS3-XITRIX-v0.9core-SwiftUI-${SHORT_SHA}-unsigned.ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"
          shasum -a 256 "$IPA" > "$IPA.sha256"
          unzip -l "$IPA" | tee swiftui-host-ipa-contents.txt
          grep -q 'Payload/RPCS3.app/Frameworks/libRPCS3Core.dylib' swiftui-host-ipa-contents.txt

      - name: Upload unsigned official-core test IPA
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-XITRIX-v0.9core-SwiftUI-unsigned
          path: smoke-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-SwiftUI-host-smoke
          path: |
            swiftui-host-build.log
            swiftui-host-loads.txt
            swiftui-host-strings.txt
            swiftui-host-plist.txt
            swiftui-host-ipa-contents.txt
            native-ios-build/app-file.txt
            native-ios-build/app-archs.txt
          if-no-files-found: warn
          retention-days: 7
