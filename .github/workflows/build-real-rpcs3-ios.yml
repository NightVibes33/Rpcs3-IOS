name: Build Real RPCS3 iOS

on:
  workflow_dispatch:
  push:
    branches: [ios-core-v30-migration]
    paths:
      - "NativeApp/**"
      - "scripts/build-real-xitrix-core.sh"
      - "scripts/build-real-ios-app.sh"
      - "UPSTREAM_RPCS3_REVISION"
      - ".github/workflows/build-real-rpcs3-ios.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: real-rpcs3-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: XITRIX RPCS3Core + native iOS host
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      IOS_DEPLOYMENT_TARGET: "17.4"
      BUILD_JOBS: "3"
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for formula in cmake ninja ccache llvm@22; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          "$(brew --prefix llvm@22)/bin/clang" --version

      - name: Restore RPCS3 iOS compiler cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
          key: rpcs3-ios-ccache-${{ runner.os }}-xcode16.4-${{ hashFiles('UPSTREAM_RPCS3_REVISION', 'scripts/build-real-xitrix-core.sh') }}
          restore-keys: |
            rpcs3-ios-ccache-${{ runner.os }}-xcode16.4-

      - name: Reject legacy product path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'XITRIX/rpcs3.git' scripts/build-real-xitrix-core.sh
          grep -q 'RPCS3_FRONTEND=IOS' scripts/build-real-xitrix-core.sh
          grep -q 'WITH_LLVM=ON' scripts/build-real-xitrix-core.sh
          grep -q 'dlopen' NativeApp/RPCS3DynamicCore.mm
          grep -q 'RPCS3_IOS_EXPANDED_JIT_ARENA' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_boot_big_picture_mode' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_install_folder' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_install_rap' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_install_game_patch' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_fetch_game_update_manifest' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_download_game_update_package' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_enumerate_games' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_enumerate_savestates' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_duplicate_savestate' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_delete_savestate' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_enumerate_trophies' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_delete_game' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_clear_game_cache' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_get_game_cache_info' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_get_rpcn_config' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_enumerate_rpcn_servers' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_set_rpcn_server' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_add_rpcn_server' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_remove_rpcn_server' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_set_rpcn_credentials' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_test_rpcn_account' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_enumerate_runtime_patches' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_set_runtime_patch_enabled' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_enumerate_settings' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_set_setting' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_reset_settings' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_enumerate_game_settings' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_set_game_setting' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_reset_game_settings' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_remove_game_settings' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_boot_vsh' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_boot_game' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_get_boot_progress' NativeApp/RPCS3DynamicCore.mm
          grep -q 'rpcs3_ios_get_performance_metrics' NativeApp/RPCS3DynamicCore.mm
          grep -q '@main' NativeApp/RPCS3App.swift
          grep -q 'struct GamesView' NativeApp/ContentView.swift
          ! grep -R -n 'RPCS3UpstreamRuntime.framework' NativeApp scripts/build-real-*.sh
          ! grep -R -n 'Qt6::\|QApplication\|QMainWindow\|Flutter' NativeApp scripts/build-real-*.sh

      - name: Try verified baseline RPCS3Core artifact
        id: baseline-core-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: RPCS3-XITRIX-build-evidence
          path: baseline-core
          run-id: 36348158249
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Adopt matching baseline RPCS3Core
        id: baseline-core
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_REVISION="$(tr -d '[:space:]' < UPSTREAM_RPCS3_REVISION)"
          echo "reused=false" >> "$GITHUB_OUTPUT"

          CORE="$(find baseline-core -type f -name 'libRPCS3Core.dylib' -print -quit 2>/dev/null || true)"
          if [[ -z "$CORE" ]]; then
            echo "No completed baseline RPCS3Core artifact is available; source rebuild required."
            exit 0
          fi

          CANDIDATE="$(dirname "$CORE")"
          test -f "$CANDIDATE/RPCS3_SOURCE_COMMIT.txt" || exit 0
          test -f "$CANDIDATE/RPCS3_IOS_ABI.txt" || exit 0

          SOURCE_COMMIT="$(tr -d '[:space:]' < "$CANDIDATE/RPCS3_SOURCE_COMMIT.txt")"
          ABI="$(tr -d '[:space:]' < "$CANDIDATE/RPCS3_IOS_ABI.txt")"
          if [[ "$SOURCE_COMMIT" != "$EXPECTED_REVISION" || "$ABI" != "30" ]]; then
            echo "Baseline identity mismatch: source=$SOURCE_COMMIT abi=$ABI"
            exit 0
          fi

          if [[ -f "$CANDIDATE/libRPCS3Core.dylib.sha256" ]]; then
            (
              cd "$CANDIDATE"
              shasum -a 256 -c libRPCS3Core.dylib.sha256
            )
          fi

          nm -gU "$CORE" > "$RUNNER_TEMP/baseline-core-symbols.txt"
          for symbol in             _rpcs3_ios_abi_version             _rpcs3_ios_initialize             _rpcs3_ios_run_llvm_self_test             _rpcs3_ios_update_config_database             _rpcs3_ios_set_display_surface             _rpcs3_ios_enumerate_games             _rpcs3_ios_enumerate_savestates             _rpcs3_ios_duplicate_savestate             _rpcs3_ios_delete_savestate             _rpcs3_ios_enumerate_trophies             _rpcs3_ios_enumerate_settings             _rpcs3_ios_set_setting             _rpcs3_ios_reset_settings             _rpcs3_ios_enumerate_game_settings             _rpcs3_ios_set_game_setting             _rpcs3_ios_reset_game_settings             _rpcs3_ios_remove_game_settings             _rpcs3_ios_boot_big_picture_mode             _rpcs3_ios_boot_game             _rpcs3_ios_shutdown; do
            grep -q " $symbol$" "$RUNNER_TEMP/baseline-core-symbols.txt"
          done

          rm -rf BuildSupport/RPCS3Core
          mkdir -p BuildSupport
          cp -R "$CANDIDATE" BuildSupport/RPCS3Core
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "Reusing verified RPCS3Core from baseline run 36348158249."

      - name: Build real XITRIX RPCS3Core
        if: steps.baseline-core.outputs.reused != 'true'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-real-xitrix-core.sh 2>&1 | tee real-core-build.log

      - name: Build native iOS host
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-real-ios-app.sh 2>&1 | tee real-app-build.log

      - name: Validate exact product
        id: product
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat native-ios-build/app-path.txt)"
          BIN="$APP/RPCS3"
          CORE="$APP/Frameworks/libRPCS3Core.dylib"

          test -s "$BIN"
          test -s "$CORE"
          test "$(cat BuildSupport/RPCS3Core/RPCS3_IOS_ABI.txt)" = "30"
          test "$(cat BuildSupport/RPCS3Core/RPCS3_SOURCE_COMMIT.txt)" = "$(tr -d '[:space:]' < UPSTREAM_RPCS3_REVISION)"

          otool -L "$BIN" | tee app-loads.txt
          ! grep -q 'libRPCS3Core.dylib' app-loads.txt
          grep -q 'SwiftUI.framework/SwiftUI' app-loads.txt
          grep -q 'UIKit.framework/UIKit' app-loads.txt
          ! grep -Eiq 'Qt(Core|Gui|Widgets)|RPCS3UpstreamRuntime|Flutter' app-loads.txt

          strings "$BIN" > app-strings.txt
          grep -q 'RPCS3_IOS_EXPANDED_JIT_ARENA' app-strings.txt
          grep -q 'libRPCS3Core.dylib' app-strings.txt
          grep -q 'Big Picture Mode' app-strings.txt
          grep -q 'rpcs3_ios_enumerate_games' app-strings.txt
          grep -q 'rpcs3_ios_boot_game' app-strings.txt

          /usr/bin/plutil -lint "$APP/Info.plist"
          /usr/bin/plutil -p "$APP/Info.plist" > app-plist.txt
          grep -q '"MinimumOSVersion" => "17.4"' app-plist.txt
          grep -q '"LSSupportsGameMode" => 1' app-plist.txt
          grep -q '"UIBackgroundModes"' app-plist.txt
          grep -q '"NSLocalNetworkUsageDescription"' app-plist.txt

          grep -q '<key>com.apple.developer.kernel.extended-virtual-addressing</key>' NativeApp/RPCS3.entitlements
          grep -q '<key>com.apple.developer.kernel.increased-debugging-memory-limit</key>' NativeApp/RPCS3.entitlements
          grep -q '<key>com.apple.developer.kernel.increased-memory-limit</key>' NativeApp/RPCS3.entitlements
          grep -q '<key>get-task-allow</key>' NativeApp/RPCS3.entitlements

          nm -gU "$CORE" > core-exports.txt
          for symbol in             _rpcs3_ios_initialize             _rpcs3_ios_run_llvm_self_test             _rpcs3_ios_set_display_surface             _rpcs3_ios_set_pad_state             _rpcs3_ios_install_firmware             _rpcs3_ios_install_package             _rpcs3_ios_install_iso             _rpcs3_ios_install_zip             _rpcs3_ios_install_folder             _rpcs3_ios_install_rap             _rpcs3_ios_install_game_patch             _rpcs3_ios_fetch_game_update_manifest             _rpcs3_ios_download_game_update_package             _rpcs3_ios_enumerate_savestates             _rpcs3_ios_enumerate_trophies             _rpcs3_ios_get_game_cache_info             _rpcs3_ios_clear_game_cache             _rpcs3_ios_delete_game             _rpcs3_ios_boot_big_picture_mode             _rpcs3_ios_boot_vsh             _rpcs3_ios_boot_game             _rpcs3_ios_get_boot_progress             _rpcs3_ios_get_performance_metrics             _rpcs3_ios_get_rpcn_config             _rpcs3_ios_enumerate_rpcn_servers             _rpcs3_ios_set_rpcn_server             _rpcs3_ios_add_rpcn_server             _rpcs3_ios_remove_rpcn_server             _rpcs3_ios_set_rpcn_credentials             _rpcs3_ios_test_rpcn_account             _rpcs3_ios_enumerate_runtime_patches             _rpcs3_ios_set_runtime_patch_enabled             _rpcs3_ios_enumerate_settings             _rpcs3_ios_set_setting             _rpcs3_ios_reset_settings             _rpcs3_ios_enumerate_game_settings             _rpcs3_ios_set_game_setting             _rpcs3_ios_reset_game_settings             _rpcs3_ios_remove_game_settings             _rpcs3_ios_stop_emulation             _rpcs3_ios_shutdown; do
            grep -q " $symbol$" core-exports.txt
          done

          file "$BIN"
          file "$CORE"
          lipo -archs "$BIN" | grep -qw arm64
          lipo -archs "$CORE" | grep -qw arm64

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload output
          mkdir -p Payload output
          /usr/bin/ditto "${{ steps.product.outputs.app }}" Payload/RPCS3.app
          rm -rf Payload/RPCS3.app/_CodeSignature
          rm -f Payload/RPCS3.app/embedded.mobileprovision
          /usr/bin/plutil -lint Payload/RPCS3.app/Info.plist
          test -s Payload/RPCS3.app/Frameworks/libRPCS3Core.dylib

          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          IPA="output/RPCS3-XITRIX-iOS-${SHORT_SHA}-unsigned.ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"
          shasum -a 256 "$IPA" > "$IPA.sha256"
          unzip -l "$IPA" | tee ipa-contents.txt
          ! grep -Eiq 'Qt(Core|Gui|Widgets)|RPCS3UpstreamRuntime' ipa-contents.txt
          grep -q 'Payload/RPCS3.app/Frameworks/libRPCS3Core.dylib' ipa-contents.txt
          ls -lh output

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-XITRIX-iOS-unsigned
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload core and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-XITRIX-build-evidence
          path: |
            BuildSupport/RPCS3Core/**
            real-core-build.log
            real-app-build.log
            app-loads.txt
            app-strings.txt
            app-plist.txt
            core-exports.txt
            ipa-contents.txt
            native-ios-build/app-file.txt
            native-ios-build/app-archs.txt
          if-no-files-found: warn
          retention-days: 30
